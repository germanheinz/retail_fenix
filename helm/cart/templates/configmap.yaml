apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "retail-fenix.fullname" . }}
  labels:
    {{- include "retail-fenix.labels" . | nindent 4 }}
data:
  SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
  RETAIL_CART_PERSISTENCE_PROVIDER: {{ .Values.app.persistence.provider | quote }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: {{ include "retail-fenix.dynamodb.endpoint" . | quote }}
  {{- if and (eq "dynamodb" .Values.app.persistence.provider) .Values.dynamodb.create }}
  AWS_ACCESS_KEY_ID: "dummy"
  AWS_SECRET_ACCESS_KEY: "dummy"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  # Disable OTEL Java agent entirely for cart — AWS SDK v2.32 built-in OTEL metrics
  # causes ClassCastException (DefaultMeter$NoopLongHistogramBuilder vs ExtendedLongHistogramBuilder)
  # in static initializer before any runtime config takes effect. Known incompatibility
  # between adot-java-agent 1.33.0 and AWS SDK v2.32+
  OTEL_INSTRUMENTATION_AWS_SDK_ENABLED: "false"
  OTEL_JAVAAGENT_ENABLED: "false"
  {{- end }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: {{ .Values.app.persistence.dynamodb.createTable | quote }}
  RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: {{ .Values.app.persistence.dynamodb.tableName | quote }}

rabbitmq:
  create: true

app:
  persistence:
    secret:
      create: true
      name: orders-db
      username: orders_user
      password: orders_pass123

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

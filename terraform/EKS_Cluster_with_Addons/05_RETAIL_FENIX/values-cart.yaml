# ============================================================================
# CART SERVICE - CUSTOM VALUES
# ============================================================================

# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION (DynamoDB Local in-cluster)
# ----------------------------------------------------------------------------
app:
  persistence:
    provider: dynamodb
    dynamodb:
      createTable: true
      tableName: Items

dynamodb:
  create: true

# ----------------------------------------------------------------------------
# RESOURCE MANAGEMENT
# ----------------------------------------------------------------------------
resources:
  limits:
    cpu: 256m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 256Mi

# ----------------------------------------------------------------------------
# HEALTH PROBES
# ----------------------------------------------------------------------------
livenessProbe:
  initialDelaySeconds: 90
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 75
  periodSeconds: 10
  failureThreshold: 3

# ----------------------------------------------------------------------------
# AUTOSCALING - HORIZONTAL POD AUTOSCALER (HPA)
# ----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ----------------------------------------------------------------------------
# OPENTELEMETRY AUTO-INSTRUMENTATION
# ----------------------------------------------------------------------------
# cart is a Java (Spring Boot) service — inject-sdk triggers Java agent injection
# aws-sdk instrumentation disabled: OTEL Java agent v1.33 conflicts with
# AWS SDK v2 ClasspathInterceptorChainFactory causing NPE on DynamoDB client init
opentelemetry:
  enabled: false

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "default-instrumentation"
  instrumentation.opentelemetry.io/java-container-names: "cart"

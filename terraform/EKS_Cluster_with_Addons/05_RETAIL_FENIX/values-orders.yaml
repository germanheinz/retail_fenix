# ============================================================================
# ORDERS SERVICE - CUSTOM VALUES
# ============================================================================

# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION (PostgreSQL in-cluster)
# ----------------------------------------------------------------------------
postgresql:
  create: true

app:
  persistence:
    provider: postgres
    database: "orders"
    secret:
      create: true
      name: orders-db
      username: orders_user
      password: orders_pass123

# ----------------------------------------------------------------------------
# MESSAGING CONFIGURATION (RabbitMQ in-cluster)
# ----------------------------------------------------------------------------
rabbitmq:
  create: true

  messaging:
    provider: rabbitmq
    rabbitmq:
      secret:
        create: true
        name: orders-rabbitmq
        username: "guest"
        password: "guest"

# ----------------------------------------------------------------------------
# RESOURCE MANAGEMENT
# ----------------------------------------------------------------------------
resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 256Mi

# ----------------------------------------------------------------------------
# HEALTH PROBES
# ----------------------------------------------------------------------------
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

# ----------------------------------------------------------------------------
# AUTOSCALING - HORIZONTAL POD AUTOSCALER (HPA)
# ----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ----------------------------------------------------------------------------
# OPENTELEMETRY AUTO-INSTRUMENTATION
# ----------------------------------------------------------------------------
# orders is a Java (Spring Boot) service — inject-sdk triggers Java agent injection
opentelemetry:
  enabled: true
  instrumentation: "default-instrumentation"
